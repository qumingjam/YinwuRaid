# ============================================================
# YinwuRaid 主配置文件
# ============================================================
# 
# 注意：本插件已采用模块化配置系统
# - 袭击相关配置请查看 raid/ 目录
# - 村民赠礼配置请查看 rewards/ 目录
#
# 详细文档请参考:
# - CONFIG_README.md - 配置说明
# - MIGRATION_GUIDE.md - 迁移指南
# ============================================================

# ============================================================
# 基础设置
# ============================================================

# 是否启用插件
enabled: true

# 语言设置 (目前支持: zh_CN)
language: "zh_CN"

# 是否启用更新检查
check-updates: true

# 调试模式（生产环境建议关闭）
debug: false

# ============================================================
# 数据库设置
# ============================================================

database:
  # 数据库类型: H2, MYSQL
  type: "H2"
  
  # MySQL配置（仅在type为MYSQL时使用）
  mysql:
    host: "localhost"
    port: 3306
    database: "yinwuraids"
    username: "root"
    password: "password"
    use-ssl: false
  
  # 连接池设置
  pool-size: 10

# ============================================================
# 袭击系统配置
# ============================================================
# 详细配置请查看 raid/ 目录下的文件
# - raid/config.yml - 袭击全局配置（信标、灾厄等级等）
# - raid/level-6.yml - 彩蛋级袭击配置
# - raid/level-7.yml - 简单级袭击配置
# - raid/level-8.yml - 普通级袭击配置
# - raid/level-9.yml - 困难级袭击配置
# - raid/level-10.yml - 极难级袭击配置
# - raid/mob-names.yml - 怪物名称映射

raid:
  # 是否启用袭击系统
  enabled: true
  
  # 袭击冷却时间（秒）
  cooldown: 3600
  
  # 袭击检测半径（方块）
  detection-radius: 128
  
  # 是否启用灾厄效果
  doom-effect-enabled: true

# ============================================================
# 消息设置
# ============================================================

messages:
  # 是否启用前缀
  prefix-enabled: true
  
  # 消息前缀
  prefix: "§6§l[YinwuRaid] §r"
  
  # 是否启用声音提示
  sound-enabled: true
  
  # 是否启用ActionBar消息
  actionbar-enabled: true
  
  # 是否启用Title消息
  title-enabled: true

# ============================================================
# 性能设置
# ============================================================

performance:
  # 异步处理任务
  async-tasks: true
  
  # 实体生成限制（每秒）
  entity-spawn-limit: 50
  
  # 粒子效果限制
  particle-limit: 100
  
  # 是否启用缓存
  cache-enabled: true
  
  # 缓存过期时间（秒）
  cache-expiry: 300

# ============================================================
# Folia兼容设置
# ============================================================

folia:
  # 是否启用Folia优化
  enabled: true
  
  # 区域线程调度
  region-scheduler: true
  
  # 实体线程组
  entity-thread-group: true

# ============================================================
# 灾厄袭击性能优化配置
# ============================================================
# 以下配置用于优化灾厄袭击期间的性能表现
# 可根据服务器配置调整这些值

raid-performance:
  # ----------------------------------------------------------
  # BossBar 更新间隔（单位：tick，20 tick = 1秒）
  # ----------------------------------------------------------
  # 控制袭击进度条的更新频率
  # 推荐值：
  #   - 高配服务器: 20 (每秒1次)
  #   - 普通服务器: 40 (每2秒1次) ← 默认
  #   - 低配服务器: 60 (每3秒1次)
  # ----------------------------------------------------------
  bossbar-update-interval: 40
  
  # ----------------------------------------------------------
  # 迷雾效果更新间隔（单位：tick）
  # ----------------------------------------------------------
  # 控制灾厄迷雾粒子的生成频率
  # 推荐值：
  #   - 高配服务器: 10 (每秒2次)
  #   - 普通服务器: 20 (每秒1次) ← 默认
  #   - 低配服务器: 40 (每2秒1次)
  # ----------------------------------------------------------
  fog-effect-interval: 20
  
  # ----------------------------------------------------------
  # 迷雾粒子数量（每个玩家每次生成的粒子数）
  # ----------------------------------------------------------
  # 控制迷雾的视觉密度
  # 推荐值：
  #   - 高配服务器: 30 (密集)
  #   - 普通服务器: 20 (适中) ← 默认
  #   - 低配服务器: 15 (稀疏)
  # ----------------------------------------------------------
  fog-particle-count: 20
  
  # ----------------------------------------------------------
  # 村民检测间隔（单位：tick）
  # ----------------------------------------------------------
  # 控制袭击期间检测村民存活状态的频率
  # 默认：60 (每3秒1次)
  # ----------------------------------------------------------
  villager-check-interval: 60
  
  # ----------------------------------------------------------
  # Buff施加间隔（单位：tick）
  # ----------------------------------------------------------
  # 控制给范围内玩家施加药水效果的频率
  # 默认：200 (每10秒1次)
  # ----------------------------------------------------------
  buff-apply-interval: 200
  
  # ----------------------------------------------------------
  # 袭击调度器检查间隔（单位：tick）
  # ----------------------------------------------------------
  # 控制检查袭击波次进度的频率
  # 默认：60 (每3秒1次)
  # ----------------------------------------------------------
  raid-scheduler-interval: 60
  
  # ----------------------------------------------------------
  # 最多检测的玩家数量
  # ----------------------------------------------------------
  # 限制每次检测的玩家数量上限，避免大量玩家时性能下降
  # 默认：50
  # ----------------------------------------------------------
  max-player-check-count: 50
  
  # ----------------------------------------------------------
  # 实体侦测范围配置
  # ----------------------------------------------------------
  entity-follow-range:
    # 信标守护者的追踪范围（方块）
    beacon-defender: 64.0
    
    # 巨型铁傀儡的追踪范围（方块）
    giant-golem: 48.0
    
    # 普通铁傀儡的追踪范围（方块）
    normal-golem: 64.0
    
    # 其他怪物的追踪范围（方块）
    other-mobs: 48.0
  
  # ----------------------------------------------------------
  # Title显示时间配置（失败时）
  # ----------------------------------------------------------
  title-timing:
    failure:
      # 第一段Title：淡入时间（tick）
      first-fade-in: 10
      # 第一段Title：显示时间（tick）
      first-display: 60
      # 第一段Title：淡出时间（tick）
      first-fade-out: 20
      
      # 第二段Title：淡入时间（tick）
      second-fade-in: 10
      # 第二段Title：显示时间（tick）
      second-display: 100
      # 第二段Title：淡出时间（tick）
      second-fade-out: 20
      
      # 两段Title之间的间隔（tick）
      delay-between: 80

# ============================================================
# 信标守护者配置
# ============================================================
beacon-defender:
  # 巨型铁傀儡体型倍数
  scale-multiplier: 2.0

# ============================================================
# 调试配置扩展
# ============================================================
debug:
  # 是否启用苦力怕检测日志
  creeper-detection: false
  
  # ✅ 是否启用怪物生成位置调试日志（会在后台显示每个怪物的生成尝试过程）
  spawn-location: false
