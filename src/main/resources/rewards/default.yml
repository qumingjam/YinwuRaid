# ============================================
# 村民职业奖励配置 - 默认 (Default)
# ============================================
# 此配置用于：
# 1. 失业村民（没有工作站点）
# 2. 未找到对应职业配置时的后备方案
# 3. 任何未知职业的通用奖励

default:
  # ✅ 彩蛋级（灾厄 6 级）- 只有绿宝石
  villager-hero-6:
    enabled: true
    rewards:
      - material: EMERALD
        amount: 4-8
        chance: 1.0
  
  # 7级灾厄奖励
  villager-hero-7:
    enabled: true
    rewards:
      - material: BREAD
        amount: 1-3
        chance: 0.5
      - material: EMERALD
        amount: 1-2
        chance: 0.5

  # 8级灾厄奖励
  villager-hero-8:
    enabled: true
    rewards:
      - material: COOKED_BEEF
        amount: 2-4
        chance: 0.4
      - material: EMERALD
        amount: 2-4
        chance: 0.6

  # 9级灾厄奖励
  villager-hero-9:
    enabled: true
    rewards:
      - material: GOLDEN_APPLE
        amount: 1
        chance: 0.2
      - material: EMERALD
        amount: 5-8
        chance: 0.8

  # 10级灾厄奖励
  villager-hero-10:
    enabled: true
    rewards:
      - material: ENCHANTED_GOLDEN_APPLE
        amount: 1
        chance: 0.15
      - material: EMERALD
        amount: 10-20
        chance: 0.85
